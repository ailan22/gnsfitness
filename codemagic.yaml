# Repository root must be gns-recovery. Configure gns_public_backend first.
# Builds start manually. ios-signed remains internal; ios-app-store prepares public distribution.
workflows:
  ios-store-screenshots:
    name: GNS - capturas App Store con datos ficticios
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 24
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Preparar interfaz con datos ficticios
        script: |
          set -e
          node scripts/prepare-store-screenshots.mjs
          npx cap sync ios
          node normalize-ios-paths.mjs
      - name: Compilar para simulador
        script: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/store-screenshots CODE_SIGNING_ALLOWED=NO build
      - name: Capturar iPhone
        script: node scripts/capture-ios-screenshots.mjs
    artifacts:
      - store-screenshots/*.png
  ios-check:
    name: GNS iPhone - verificar compilacion
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      xcode: latest
      groups:
        - gns_public_backend
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Validar configuracion publica
        script: node scripts/check-ios-environment.mjs
      - name: Verificar codigo
        script: npm run lint
      - name: Preparar iOS
        script: |
          set -e
          npm run mobile:prepare
          npx cap sync ios
          node normalize-ios-paths.mjs
      - name: Compilar sin firma en macOS
        script: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-check CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
    artifacts:
      - ios-build.log
  ios-signed:
    name: GNS iPhone - TestFlight interno
    integrations:
      app_store_connect: GNS Codemagic
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      xcode: latest
      groups:
        - gns_public_backend
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uy.gnsfitness.app
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Validar configuracion publica
        script: node scripts/check-ios-environment.mjs
      - name: Preparar iOS
        script: |
          set -e
          npm run lint
          npm run mobile:prepare
          npx cap sync ios
          node normalize-ios-paths.mjs
      - name: Aplicar perfiles de la titular
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Numerar compilacion
        script: |
          set -e
          cd ios/App
            : "${PROJECT_BUILD_NUMBER:?Missing global project build number}"
            agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"
      - name: Generar archivo para TestFlight
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
  ios-app-store:
    name: GNS iPhone - preparar App Store
    integrations:
      app_store_connect: GNS Codemagic
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      xcode: latest
      groups:
        - gns_public_backend
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uy.gnsfitness.app
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Validar configuracion y privacidad
        script: |
          set -e
          node scripts/check-ios-environment.mjs
          npm run lint
          npm run test
          npm audit --audit-level=low
      - name: Preparar version de distribucion
        script: |
          set -e
          npm run mobile:prepare
          npx cap sync ios
          node normalize-ios-paths.mjs
      - name: Aplicar firma para App Store
        script: xcode-project use-profiles
      - name: Numerar compilacion
        script: |
          set -e
          cd ios/App
            : "${PROJECT_BUILD_NUMBER:?Missing global project build number}"
            agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"
      - name: Generar archivo para App Store
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
